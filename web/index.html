<div id="app">
  <main id="view" class="view"></main>

  <div id="mini" class="mini" hidden>
    <div class="mini-body">
      <div class="mini-art"><img alt="" id="mini-img"></div>
      <div class="mini-txt"><div class="mini-t" id="mini-t"></div><div class="mini-s" id="mini-s"></div></div>
      <button class="mini-btn" data-mini="like" aria-label="Подобається"><svg class="ic"><use href="#i-heart"/></svg></button>
      <button class="mini-btn mini-pp" data-mini="toggle" aria-label="Пауза/Відтворення"><svg class="ic"><use href="#i-play"/></svg></button>
    </div>
    <div class="mini-prog"><i id="mini-prog"></i></div>
  </div>

  <nav class="tabs" id="tabs">
    <a class="tab" href="#/" data-tab="home"><svg class="ic off"><use href="#i-home"/></svg><svg class="ic onn"><use href="#i-home-f"/></svg><span>Головна</span></a>
    <a class="tab" href="#/search" data-tab="search"><svg class="ic off"><use href="#i-search"/></svg><svg class="ic onn"><use href="#i-search"/></svg><span>Пошук</span></a>
    <a class="tab" href="#/library" data-tab="library"><svg class="ic off"><use href="#i-lib"/></svg><svg class="ic onn"><use href="#i-lib-f"/></svg><span>Бібліотека</span></a>
  </nav>
</div>

<section id="player" class="player" aria-hidden="true">
  <div class="pl-bg"><img alt="" id="pl-bgimg"></div>
  <div class="pl-inner">
    <header class="pl-head" id="pl-head">
      <button class="pl-hbtn" data-p="close" aria-label="Згорнути"><svg class="ic"><use href="#i-down"/></svg></button>
      <div class="pl-ctx"><small>ВІДТВОРЮЄТЬСЯ З</small><b id="pl-ctx">—</b></div>
      <button class="pl-hbtn" data-p="more" aria-label="Більше"><svg class="ic"><use href="#i-more"/></svg></button>
    </header>
    <div class="pl-stage" id="pl-stage">
      <div class="pl-art" id="pl-art"><img alt="" id="pl-img"></div>
    </div>
    <div class="pl-meta">
      <div class="pl-titles">
        <div class="pl-title"><span id="pl-title"></span></div>
        <a class="pl-artist" id="pl-artist"></a>
      </div>
      <button class="pl-like" data-p="like" aria-label="Подобається"><svg class="ic"><use href="#i-heart"/></svg></button>
    </div>
    <div class="pl-seek">
      <div class="seek" id="seek"><div class="seek-track"><i class="seek-buf" id="seek-buf"></i><i class="seek-fill" id="seek-fill"></i></div><i class="seek-thumb" id="seek-thumb"></i></div>
      <div class="pl-times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
    </div>
    <div class="pl-ctrls">
      <button class="pc-btn" data-p="shuffle" aria-label="Перемішати"><svg class="ic"><use href="#i-shuffle"/></svg></button>
      <button class="pc-btn pc-big" data-p="prev" aria-label="Попередній"><svg class="ic"><use href="#i-prev"/></svg></button>
      <button class="pc-play" data-p="toggle" aria-label="Відтворення"><svg class="ic"><use href="#i-play"/></svg><span class="spin"></span></button>
      <button class="pc-btn pc-big" data-p="next" aria-label="Наступний"><svg class="ic"><use href="#i-next"/></svg></button>
      <button class="pc-btn" data-p="repeat" aria-label="Повтор"><svg class="ic"><use href="#i-repeat"/></svg></button>
    </div>
    <div class="pl-foot">
      <button class="pf-btn" data-p="lyrics"><svg class="ic"><use href="#i-mic"/></svg><span>Текст</span></button>
      <button class="pf-btn" data-p="sleep"><svg class="ic"><use href="#i-moon"/></svg><span id="sleep-l">Таймер</span></button>
      <button class="pf-btn" data-p="share"><svg class="ic"><use href="#i-share"/></svg><span>Поділитися</span></button>
      <button class="pf-btn" data-p="queue"><svg class="ic"><use href="#i-queue"/></svg><span>Черга</span></button>
    </div>
  </div>

  <div class="panel" id="lyr" aria-hidden="true">
    <header class="pn-head"><button class="pl-hbtn" data-p="panel-close"><svg class="ic"><use href="#i-down"/></svg></button><div class="pn-t"><b>Текст пісні</b><small id="lyr-sub"></small></div><span class="pl-hbtn"></span></header>
    <div class="pn-body lyr-body" id="lyr-body"></div>
  </div>
  <div class="panel" id="que" aria-hidden="true">
    <header class="pn-head"><button class="pl-hbtn" data-p="panel-close"><svg class="ic"><use href="#i-down"/></svg></button><div class="pn-t"><b>Черга</b><small id="que-sub"></small></div><span class="pl-hbtn"></span></header>
    <div class="pn-body" id="que-body"></div>
    <footer class="que-foot">
      <button class="qf-btn" data-p="shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
      <button class="qf-btn" data-p="repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
      <button class="qf-btn qf-auto" data-p="autoplay"><svg class="ic"><use href="#i-radio"/></svg><span>Автопідбір</span></button>
    </footer>
  </div>
</section>

<div id="toast" class="toast" role="status"></div>
<audio id="audio" preload="auto" playsinline></audio>
<script type="module" src="js/app.js"></script>
